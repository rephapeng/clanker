# Clanker + Hermes Agent — local & server stack.
#
# Services (all on the internal `clanker_default` network):
#   • clanker-api        Go HTTP API on :47180 (bearer-auth, Tencent + vLLM-backed)
#   • clanker-dashboard  Vite preview of the React dashboard on :4173
#   • clanker-mcp        MCP server on :39393 — translates clanker-api into
#                        Model Context Protocol tools for Hermes / Claude
#                        Code / Cursor to consume.
#   • hermes-agent       Nous Research's Hermes Agent (https://github.com/nousresearch/hermes-agent).
#                        Reads ~/.hermes/config.yaml (mounted from ./hermes-config)
#                        which points its MCP client at clanker-mcp.
#
# Secrets and runtime knobs all live in .env (gitignored).
#
# Usage:
#   docker compose up -d --build      # first time / after Go code changes
#   docker compose up -d              # subsequent restarts
#   docker compose logs -f clanker-mcp hermes-agent
#   docker compose down               # stop and remove

services:
  clanker-api:
    build:
      context: .
      dockerfile: Dockerfile.sre
    image: clanker:local
    container_name: clanker-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "47180:47180"
    command:
      - server
      - --host=0.0.0.0
      - --port=47180
      - --ai-profile=openai
      - --openai-key=${VLLM_API_KEY}
      - --openai-model=${VLLM_MODEL}
      - --local-model-inference-url=${VLLM_BASE_URL}
      - --no-thinking
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:47180/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  clanker-dashboard:
    image: node:20-alpine
    container_name: clanker-dashboard
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "4173:4173"
    # Install deps if missing, build dist if missing, then serve.
    # Re-running `up` is fast because both steps no-op when artifacts exist.
    command:
      - sh
      - -c
      - |
        set -e
        [ -d node_modules ] || npm ci --no-audit --no-fund
        [ -d dist ] || npm run build
        npm run preview
    depends_on:
      clanker-api:
        condition: service_started

  # MCP server: same clanker:local image, different command. Translates
  # tool calls from Hermes/Claude Code/Cursor into HTTP requests against
  # clanker-api over the internal network. NOT published externally —
  # only Hermes (and other MCP clients on the same docker network) reach it.
  clanker-mcp:
    image: clanker:local
    container_name: clanker-mcp
    restart: unless-stopped
    # Same .env as clanker-api so the `clanker_run_command` MCP tool — which
    # exec's the local clanker binary inside THIS container — has Tencent
    # credentials (TENCENT_SECRET_ID/KEY etc.). HTTP-backed tools don't need
    # these, but the subprocess CLI path does.
    env_file: .env
    environment:
      CLANKER_API_URL: http://clanker-api:47180
      CLANKER_API_TOKEN: ${CLANKER_API_TOKEN}
    expose:
      - "39393"
    # Loopback publish so host-side Hermes (moved out of the docker network)
    # can reach the MCP endpoint at http://127.0.0.1:39393.
    ports:
      - "127.0.0.1:39393:39393"
    command:
      - mcp
      - --transport=http
      - --listen=0.0.0.0:39393
    depends_on:
      clanker-api:
        condition: service_healthy

  # Daily renewal sweep — runs `clanker tencent expiry` on a fixed loop and
  # writes the result to stdout. The compose log retains the output, so the
  # check itself is "did the cron find anything?" — visible via:
  #
  #   docker compose logs clanker-cron
  #   docker compose logs --tail 50 -f clanker-cron
  #
  # Defaults below match the two regions this account actually uses and a
  # 14-day window (renewal-window emails from Tencent typically arrive 15
  # days out, so we beat that). Override via .env if your account scopes
  # differ: EXPIRY_REGIONS, EXPIRY_THRESHOLD, EXPIRY_INTERVAL_SEC.
  clanker-cron:
    image: clanker:local
    container_name: clanker-cron
    restart: unless-stopped
    env_file: .env
    environment:
      EXPIRY_REGIONS:      "${EXPIRY_REGIONS:-ap-singapore,ap-jakarta}"
      EXPIRY_THRESHOLD:    "${EXPIRY_THRESHOLD:-14}"
      EXPIRY_INTERVAL_SEC: "${EXPIRY_INTERVAL_SEC:-86400}"
    # Override the image's `clanker` entrypoint so the supervisor loop runs
    # the binary repeatedly instead of `clanker sh -c ...` (which the parser
    # rejects as an unknown subcommand).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # `|| true` so a non-zero exit (which means "items flagged" — the
        # whole reason this thing exists) doesn't kill the supervisor loop.
        while true; do
          printf '\n[clanker-cron] === %s ===\n' "$$(date -Iseconds)"
          clanker tencent expiry --regions="$$EXPIRY_REGIONS" --threshold="$$EXPIRY_THRESHOLD" || true
          sleep "$$EXPIRY_INTERVAL_SEC"
        done
    depends_on:
      clanker-api:
        condition: service_healthy

  # Nous Research's Hermes Agent. Built from the upstream repo on first
  # `compose up`. The repo is cloned into ./vendor/hermes-agent by
  # `make setup-hermes` (or scripts/setup-hermes.sh) — that location is
  # also what `internal/hermes/runner.go` looks for, so the same checkout
  # serves both the legacy subprocess bridge and this server mode.
  #
  # First boot: ensure `make setup-hermes` ran so ./vendor/hermes-agent
  # exists, then create ./hermes-config/config.yaml from
  # ./hermes-config/config.example.yaml and fill in your model keys.
  hermes-agent:
    # Opt-in via profile so `docker compose up -d` works before you've
    # cloned hermes-agent. Bring it up with:
    #   git clone https://github.com/NousResearch/hermes-agent.git vendor/hermes-agent
    #   docker compose --profile hermes up -d --build hermes-agent
    # Dashboard then available at http://localhost:9119
    profiles: ["hermes"]
    build:
      context: ./vendor/hermes-agent
      dockerfile: Dockerfile
    image: hermes-agent:local
    container_name: hermes-agent
    restart: unless-stopped
    environment:
      # vLLM (OpenAI-compatible) — Hermes uses these because config.yaml
      # leaves model.api_key blank and the upstream falls back to env.
      OPENAI_API_KEY:  ${VLLM_API_KEY}
      OPENAI_BASE_URL: ${VLLM_BASE_URL}
      # Browser dashboard. The entrypoint backgrounds `hermes dashboard`
      # before exec'ing the main command. HOST=0.0.0.0 auto-enables
      # --insecure (required when not on localhost).
      HERMES_DASHBOARD:      "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: "9119"
      # Hermes stores skills/memory/config under HERMES_HOME.
      HERMES_HOME: /opt/data
    volumes:
      # Persistent state (skills, memory, conversation history). Backed by
      # the EXTERNAL volume clanker_hermes_data — see the volumes: block
      # below. Deleting/recreating this container does NOT lose data.
      - hermes-data:/opt/data
      # Single-file mount: overlays config.yaml on top of the named volume.
      # READ-WRITE (no :ro) so the Hermes agent can edit its own config —
      # e.g. register new mcp_servers at runtime. Because this is a bind
      # mount, in-container writes to /opt/data/config.yaml are persisted
      # straight back to ./hermes-config/config.yaml on the host.
      - ./hermes-config/config.yaml:/opt/data/config.yaml
    ports:
      - "9119:9119"  # Hermes browser dashboard
    # Keep the container alive after the dashboard backgrounds. The
    # default `hermes` entrypoint would drop into TUI mode which has no
    # TTY here — sleep infinity is the standard headless pattern.
    command: ["sleep", "infinity"]
    depends_on:
      clanker-mcp:
        condition: service_started

volumes:
  # EXTERNAL + pre-created out of band:  docker volume create clanker_hermes_data
  #
  # `external: true` means Compose treats this volume as owned by the
  # operator, not the project — it is NEVER created or destroyed by
  # compose. The Hermes data therefore survives every teardown path:
  #   • docker rm -f hermes-agent          (container delete)
  #   • docker compose rm / down           (project teardown)
  #   • docker compose down -v             (compose skips external volumes)
  # The same volume re-attaches on the next `up`, so skills / memory /
  # conversation history carry over. To start fresh you must explicitly
  # `docker volume rm clanker_hermes_data`. Back up by archiving
  # /var/lib/docker/volumes/clanker_hermes_data/_data.
  hermes-data:
    external: true
    name: clanker_hermes_data
